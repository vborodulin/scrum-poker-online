version: "3"

services:
  mongodb:
    container_name: chpokify-mongo
    image: mongo:4.0-xenial
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
    command: mongod --port $MONGO_PORT
    env_file:
      - .env
    ports:
      - "${MONGO_PORT}:${MONGO_PORT}"
    volumes:
      - mongodb_data_container:/data/db

  migrations:
    container_name: chpokify-migrations
    env_file:
      - .env
    depends_on:
      - mongodb
    build:
      context: .
      dockerfile: migrations/Dockerfile

  redis:
    container_name: chpokify-redis
    image: redis:6.0.1-alpine
    env_file:
      - .env
    command: redis-server --port $REDIS_PORT
    ports:
      - "${REDIS_PORT}:${REDIS_PORT}"
    volumes:
      - redis_data_container:/data

  server:
    container_name: chpokify-server
    depends_on:
      - mongodb
      - redis
      - migrations
    build:
      context: .
      dockerfile: ./server/Dockerfile
    env_file:
      - .env
    volumes:
      - api-schemas_node_modules:/home/packages/api-schemas/node_modules
      - ./packages/api-schemas:/home/packages/api-schemas
      - models-types_node_modules:/home/packages/models-types/node_modules
      - ./packages/models-types:/home/packages/models-types
      - helpers_node_modules:/home/packages/helpers/node_modules
      - ./packages/helpers:/home/packages/helpers
      - routing_node_modules:/home/packages/routing/node_modules
      - ./packages/routing:/home/packages/routing
      - i18n_node_modules:/home/packages/i18n/node_modules
      - ./packages/i18n:/home/packages/i18n
      - server_node_modules:/home/server/node_modules
      - ./server/:/home/server/

  frontend:
    container_name: chpokify-frontend
    depends_on:
      - server
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    env_file:
      - .env
    environment:
      # server-side rendering calls the api inside the docker network, browser goes through nginx
      - BASE_API_SSR_URL=http://server:${APP_PORT}
    volumes:
      - api-schemas_frontend_node_modules:/home/packages/api-schemas/node_modules
      - ./packages/api-schemas:/home/packages/api-schemas
      - models-types_frontend_node_modules:/home/packages/models-types/node_modules
      - ./packages/models-types:/home/packages/models-types
      - helpers_frontend_node_modules:/home/packages/helpers/node_modules
      - ./packages/helpers:/home/packages/helpers
      - routing_frontend_node_modules:/home/packages/routing/node_modules
      - ./packages/routing:/home/packages/routing
      - i18n_frontend_node_modules:/home/packages/i18n/node_modules
      - ./packages/i18n:/home/packages/i18n
      - frontend_node_modules:/home/frontend/node_modules
      - frontend_next:/home/frontend/.next
      - ./frontend/:/home/frontend/

  nginx:
    container_name: chpokify-nginx
    image: nginx:1.21.4
    depends_on:
      - server
      - frontend
    env_file:
      - .env
    environment:
      - CLIENT_PORT=${CLIENT_PORT:-3000}
      - SERVER_PORT=${APP_PORT}
      # frontend (next dev) container
      - DEV_IP_ADDR=frontend
    ports:
      - "${NGINX_PORT:-80}:80"
    command: >
      /bin/bash -c "envsubst \"`for v in $$(compgen -v);do printf '$${%s} ' $$v;done`'\"
      < /var/www/html/docker/conf.d/localhost.tpl
      > /etc/nginx/conf.d/default.conf
      && nginx -g 'daemon off;'"
    volumes:
      - nginx_data_container:/var/www/html
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/mime.types:/etc/nginx/mime.types
      - ./nginx:/var/www/html/docker

volumes:
  mongodb_data_container:
  redis_data_container:
  routing_node_modules:
  i18n_node_modules:
  api-schemas_node_modules:
  models-types_node_modules:
  helpers_node_modules:
  server_node_modules:
  routing_frontend_node_modules:
  i18n_frontend_node_modules:
  api-schemas_frontend_node_modules:
  models-types_frontend_node_modules:
  helpers_frontend_node_modules:
  frontend_node_modules:
  frontend_next:
  nginx_data_container:
